version: 2
updates:
  # One grouped pull request per ecosystem per month.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Pinned to an exact version in pyproject.toml; bump it by hand.
      - dependency-name: rdkit
    groups:
      uv:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
